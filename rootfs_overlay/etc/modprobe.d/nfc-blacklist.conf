# ACR122U (PN533-chip) conflicts with in-kernel NFC stack.
# libnfc/nfc-poll accesses the reader via libusb and needs exclusive
# ownership of the USB interface. Without this, pn533_usb claims the
# interface at plug-in and nfc-poll exits with status=1 in a loop.
blacklist pn533_usb
blacklist pn533
blacklist nfc
